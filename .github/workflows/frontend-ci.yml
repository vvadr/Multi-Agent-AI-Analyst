name: Frontend CI

# No `paths:` filter on pull_request. If this workflow is a required check,
# path filtering makes it never report on PRs that touch no frontend file,
# leaving the PR blocked forever waiting on a run that will not happen.
on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    # Public, non-secret build values. NEXT_PUBLIC_* is inlined into the browser
    # bundle, so nothing sensitive may appear here. `example.invalid` is a
    # reserved TLD (RFC 2606) that can never resolve — a real backend URL is
    # deliberately not used.
    env:
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
      NEXT_PUBLIC_API_V1_PREFIX: /v1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

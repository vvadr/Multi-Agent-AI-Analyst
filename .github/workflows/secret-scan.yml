name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository and history
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          ghcr.io/gitleaks/gitleaks:v8.24.2
          detect --source=/repo --redact --no-banner --log-opts="--all"


name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Test with coverage
        working-directory: backend
        env:
          APP_ENV: test
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Audit Python dependencies
        working-directory: backend
        run: pip-audit

      # Compose resolves `env_file` before it validates anything, and
      # backend/.env.development is gitignored, so seed it from the committed
      # template. Placeholder values are enough for `config`, which checks
      # structure and never contacts a service.
      - name: Validate Compose configuration
        run: |
          cp backend/.env.development.example backend/.env.development
          docker compose -f infra/docker-compose.yml config --quiet

      - name: Build backend container
        run: docker build -t multi-agent-analyst-api:ci backend

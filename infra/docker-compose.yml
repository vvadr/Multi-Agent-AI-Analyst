# Local DEVELOPMENT stack.
# Runs the data services locally so the backend can work entirely against local
# infrastructure instead of the connected (production) services: Postgres,
# Qdrant, and MinIO (S3-compatible object storage). LiteLLM is optional and
# proxies to Gemini because there is no local model-provider stand-in.
#
# Configuration lives in ONE file: backend/.env.development. Nothing here needs
# a second env file — the optional gateway is off by default (see `litellm`).
#
# Two ways to use it:
#   A) Data stores only + hot-reload backend on the host (recommended for dev):
#        docker compose -f infra/docker-compose.yml up -d
#        cd backend; uvicorn app.main:app --reload --port 8000   # APP_ENV=development
#   B) Full stack in Docker (backend included):
#        docker compose -f infra/docker-compose.yml --profile fullstack up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analyst
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d analyst"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console (http://localhost:9001, minioadmin/minioadmin)
    volumes:
      - minio_data:/data

  # Creates the object-storage bucket on startup, then exits.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'waiting for minio'; sleep 2; done;
      /usr/bin/mc mb -p local/analyst-documents;
      exit 0;
      "

  # OPTIONAL OpenAI-compatible model gateway in front of Gemini. Off by default:
  # with LITELLM_BASE_URL blank the backend calls Gemini directly, so most
  # setups never need this container. Start it deliberately with
  #   docker compose -f infra/docker-compose.yml --profile gateway up -d litellm
  # and set LITELLM_BASE_URL=http://localhost:4000 in backend/.env.development.
  # Stateless: no database is configured, so it stores nothing.
  litellm:
    profiles: ["gateway"]
    image: ghcr.io/berriai/litellm:v1.92.0
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # Only the two variables the proxy needs — NOT the backend's env file.
    # Passing that in would hand a model gateway the JWT signing key and storage
    # credentials, and its DATABASE_URL makes LiteLLM exit 1 (it reads any
    # ambient DATABASE_URL for Prisma and cannot parse `postgresql+psycopg`; an
    # empty value fails too, so the variable must be absent entirely).
    # `required: false` so a checkout without this file still validates and the
    # other services still start.
    env_file:
      - path: ./litellm/litellm.env
        required: false
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    healthcheck:
      # The image is Python-based and has no curl, so probe with urllib.
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The backend in a container. Also opt-in: day-to-day development runs it on
  # the host with `uvicorn --reload`, against the data stores below.
  api:
    profiles: ["fullstack"]
    build:
      context: ../backend
    env_file:
      - ../backend/.env.development
    environment:
      APP_ENV: development
      # Override the localhost endpoints from .env.development with the
      # in-network service hostnames (the localhost values are for a
      # host-run uvicorn hitting the published ports).
      DATABASE_URL: postgresql+psycopg://analyst:analyst@postgres:5432/analyst
      QDRANT_URL: http://qdrant:6333
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      LITELLM_BASE_URL: http://litellm:4000
      # The gateway is the only container that receives the Google key.
      GEMINI_API_KEY: ""
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
